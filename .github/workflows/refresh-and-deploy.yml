name: Refresh library

on:
  schedule:
    - cron: "17 11 * * *" # once a day
  push:
    branches: [main, master]
  workflow_dispatch:

# GitHub Pages serves this branch directly, so committing the refreshed
# library is all it takes to update the site.
permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Both keys are optional. Add them under Settings → Secrets and variables → Actions.
      - name: Resolve any new channel handles
        run: node scripts/resolve-channels.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Build the library
        run: node scripts/build-library.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit refreshed library
        run: |
          git config user.name "calmtube-bot"
          git config user.email "calmtube-bot@users.noreply.github.com"
          git add channels.json data/
          git diff --staged --quiet || (git commit -m "Refresh video library" && git pull --rebase -X theirs && git push)
