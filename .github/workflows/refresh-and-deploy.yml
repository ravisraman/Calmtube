name: Refresh library and deploy

on:
  schedule:
    - cron: "17 11 * * *" # once a day
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve any new channel handles
        run: node scripts/resolve-channels.mjs
      - name: Fetch latest videos
        run: node scripts/fetch-videos.mjs
      - name: Commit refreshed library
        run: |
          git config user.name "calmtube-bot"
          git config user.email "calmtube-bot@users.noreply.github.com"
          git add channels.json data/videos.json
          git diff --staged --quiet || (git commit -m "Refresh video library" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
