<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CalmTube</title>
  <meta name="description" content="A quiet, curated way to watch YouTube: learning, movement and calm.">
  <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%237a8f6a'/%3E%3Cpath d='M13 10.5v11l9-5.5z' fill='%23f5f1ea'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#today"><span class="dot"></span>CalmTube</a>
    <nav class="nav" aria-label="Main">
      <a href="#today" data-nav="today">Today</a>
      <a href="#explore" data-nav="explore">Explore</a>
      <a href="#saved" data-nav="saved">Saved</a>
      <a href="#settings" data-nav="settings" aria-label="Settings">Settings</a>
    </nav>
  </header>

  <div id="nudge" class="nudge" hidden>
    <p></p>
    <button type="button" class="link" data-dismiss-nudge>Okay</button>
  </div>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">
    <p>No algorithm, no autoplay, no view counts. <span id="updated"></span></p>
  </footer>

  <dialog id="player" aria-label="Video player">
    <div class="player-wrap">
      <div class="player-head">
        <div>
          <p class="player-channel"></p>
          <h2 class="player-title"></h2>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close player">✕</button>
      </div>
      <div class="frame"><div id="yt"></div>
        <div class="endcard" hidden>
          <div class="breath" aria-hidden="true"></div>
          <p class="breath-label">Breathe in… and out.</p>
          <label class="note-label" for="note">One thing worth remembering</label>
          <textarea id="note" rows="2" placeholder="Optional. Saved to your notes."></textarea>
          <div class="end-actions">
            <button type="button" class="btn" data-save-note>Save &amp; close</button>
            <button type="button" class="btn ghost" data-close>Close</button>
          </div>
        </div>
      </div>
      <p class="player-summary"></p>
      <div class="player-actions">
        <button type="button" class="btn ghost" data-toggle-save></button>
        <a class="btn ghost" target="_blank" rel="noopener" data-open-yt>Open on YouTube</a>
      </div>
    </div>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
